openapi: 3.1.0
info:
  title: SkillFlow AI OTEC Compliance API
  version: 1.0.0
  description: Internal OTEC compliance evidence and readiness API. Stale optimistic versions use HTTP 409. HTTP 412 and 422 are not emitted. Readiness does not represent accreditation, authorization, or official SENCE approval.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: OTEC Compliance
paths:
  /otec-compliance/profile:
    get:
      operationId: getOtecProfile
      summary: Get the current tenant OTEC profile
      x-contract-status: implemented
      x-permission: otec_compliance.read
      x-entitlement-feature: profile
      responses: { '200': { $ref: '#/components/responses/OtecProfileResponse' }, '403': { $ref: '#/components/responses/Forbidden' }, '404': { $ref: '#/components/responses/NotFound' } }
    post:
      operationId: createOtecProfile
      summary: Create the tenant OTEC profile
      x-contract-status: implemented
      x-permission: otec_compliance.profile.manage
      x-entitlement-feature: profile
      requestBody: { $ref: '#/components/requestBodies/CreateOtecProfileBody' }
      responses: { '201': { $ref: '#/components/responses/OtecProfileResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
    patch:
      operationId: updateOtecProfile
      summary: Update the current tenant OTEC profile
      x-contract-status: implemented
      x-permission: otec_compliance.profile.manage
      x-entitlement-feature: profile
      parameters: [{ $ref: '#/components/parameters/IfMatch' }]
      requestBody: { $ref: '#/components/requestBodies/UpdateOtecProfileBody' }
      responses: { '200': { $ref: '#/components/responses/OtecProfileResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } }
  /otec-compliance/profile/deactivation:
    post: { operationId: deactivateOtecProfile, summary: Deactivate the current tenant OTEC profile, x-contract-status: implemented, x-permission: otec_compliance.profile.manage, x-entitlement-feature: profile, parameters: [{ $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '204': { description: Deactivated }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/accreditations:
    get: { operationId: listOtecAccreditations, summary: List tenant accreditations, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: accreditations, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/OtecAccreditationPageResponse' }, '403': { $ref: '#/components/responses/Forbidden' } } }
    post: { operationId: createOtecAccreditation, summary: Create an accreditation, x-contract-status: implemented, x-permission: otec_compliance.accreditation.manage, x-entitlement-feature: accreditations, requestBody: { $ref: '#/components/requestBodies/CreateOtecAccreditationBody' }, responses: { '201': { $ref: '#/components/responses/OtecAccreditationResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/accreditations/{id}:
    get: { operationId: getOtecAccreditation, summary: Get an accreditation, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: accreditations, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/OtecAccreditationResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateOtecAccreditation, summary: Update an accreditation, x-contract-status: implemented, x-permission: otec_compliance.accreditation.manage, x-entitlement-feature: accreditations, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/UpdateOtecAccreditationBody' }, responses: { '200': { $ref: '#/components/responses/OtecAccreditationResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '404': { $ref: '#/components/responses/NotFound' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/accreditations/{id}/suspension:
    post: { operationId: suspendOtecAccreditation, summary: Suspend an accreditation, x-contract-status: implemented, x-permission: otec_compliance.accreditation.manage, x-entitlement-feature: accreditations, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/OtecAccreditationResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/accreditations/{id}/revocation:
    post: { operationId: revokeOtecAccreditation, summary: Revoke an accreditation, x-contract-status: implemented, x-permission: otec_compliance.accreditation.manage, x-entitlement-feature: accreditations, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/OtecAccreditationResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/quality-certifications:
    get: { operationId: listQualityCertifications, summary: List tenant quality certifications, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: certifications, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/QualityCertificationPageResponse' } } }
    post: { operationId: createQualityCertification, summary: Create a quality certification, x-contract-status: implemented, x-permission: otec_compliance.certification.manage, x-entitlement-feature: certifications, requestBody: { $ref: '#/components/requestBodies/CreateQualityCertificationBody' }, responses: { '201': { $ref: '#/components/responses/QualityCertificationResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/quality-certifications/{id}:
    get: { operationId: getQualityCertification, summary: Get a quality certification, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: certifications, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/QualityCertificationResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateQualityCertification, summary: Update a quality certification, x-contract-status: implemented, x-permission: otec_compliance.certification.manage, x-entitlement-feature: certifications, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/UpdateQualityCertificationBody' }, responses: { '200': { $ref: '#/components/responses/QualityCertificationResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/quality-certifications/{id}/deactivation:
    post: { operationId: deactivateQualityCertification, summary: Deactivate a quality certification, x-contract-status: implemented, x-permission: otec_compliance.certification.manage, x-entitlement-feature: certifications, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/QualityCertificationResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/offices:
    get: { operationId: listOtecOffices, summary: List tenant offices, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: offices, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/OtecOfficePageResponse' } } }
    post: { operationId: createOtecOffice, summary: Create an OTEC office, x-contract-status: implemented, x-permission: otec_compliance.office.manage, x-entitlement-feature: offices, requestBody: { $ref: '#/components/requestBodies/CreateOtecOfficeBody' }, responses: { '201': { $ref: '#/components/responses/OtecOfficeResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/offices/{id}:
    get: { operationId: getOtecOffice, summary: Get an OTEC office, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: offices, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/OtecOfficeResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateOtecOffice, summary: Update an OTEC office, x-contract-status: implemented, x-permission: otec_compliance.office.manage, x-entitlement-feature: offices, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/UpdateOtecOfficeBody' }, responses: { '200': { $ref: '#/components/responses/OtecOfficeResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/offices/{id}/deactivation:
    post: { operationId: deactivateOtecOffice, summary: Deactivate an OTEC office, x-contract-status: implemented, x-permission: otec_compliance.office.manage, x-entitlement-feature: offices, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/OtecOfficeResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/legal-representatives:
    get: { operationId: listLegalRepresentatives, summary: List tenant legal representatives, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: representatives, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/LegalRepresentativePageResponse' } } }
    post: { operationId: createLegalRepresentative, summary: Create a legal representative, x-contract-status: implemented, x-permission: otec_compliance.representative.manage, x-entitlement-feature: representatives, requestBody: { $ref: '#/components/requestBodies/CreateLegalRepresentativeBody' }, responses: { '201': { $ref: '#/components/responses/LegalRepresentativeResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/legal-representatives/{id}:
    get: { operationId: getLegalRepresentative, summary: Get a legal representative, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: representatives, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/LegalRepresentativeResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateLegalRepresentative, summary: Update a legal representative, x-contract-status: implemented, x-permission: otec_compliance.representative.manage, x-entitlement-feature: representatives, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/UpdateLegalRepresentativeBody' }, responses: { '200': { $ref: '#/components/responses/LegalRepresentativeResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/legal-representatives/{id}/deactivation:
    post: { operationId: deactivateLegalRepresentative, summary: Deactivate a legal representative, x-contract-status: implemented, x-permission: otec_compliance.representative.manage, x-entitlement-feature: representatives, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/LegalRepresentativeResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/resolutions:
    get: { operationId: listOtecResolutions, summary: List tenant resolutions, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: resolutions, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/OtecResolutionPageResponse' } } }
    post: { operationId: createOtecResolution, summary: Create an OTEC resolution, x-contract-status: implemented, x-permission: otec_compliance.resolution.manage, x-entitlement-feature: resolutions, requestBody: { $ref: '#/components/requestBodies/CreateOtecResolutionBody' }, responses: { '201': { $ref: '#/components/responses/OtecResolutionResponse' }, '400': { $ref: '#/components/responses/BadRequest' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/resolutions/{id}:
    get: { operationId: getOtecResolution, summary: Get an OTEC resolution, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: resolutions, parameters: [{ $ref: '#/components/parameters/Id' }], responses: { '200': { $ref: '#/components/responses/OtecResolutionResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
    patch: { operationId: updateOtecResolution, summary: Update an OTEC resolution, x-contract-status: implemented, x-permission: otec_compliance.resolution.manage, x-entitlement-feature: resolutions, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/UpdateOtecResolutionBody' }, responses: { '200': { $ref: '#/components/responses/OtecResolutionResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/resolutions/{id}/supersession:
    post: { operationId: supersedeOtecResolution, summary: Supersede an OTEC resolution, x-contract-status: implemented, x-permission: otec_compliance.resolution.manage, x-entitlement-feature: resolutions, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/SupersedeOtecResolutionBody' }, responses: { '200': { $ref: '#/components/responses/OtecResolutionSupersessionResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/resolutions/{id}/deactivation:
    post: { operationId: deactivateOtecResolution, summary: Deactivate an OTEC resolution, x-contract-status: implemented, x-permission: otec_compliance.resolution.manage, x-entitlement-feature: resolutions, parameters: [{ $ref: '#/components/parameters/Id' }, { $ref: '#/components/parameters/IfMatch' }], requestBody: { $ref: '#/components/requestBodies/OtecTransitionBody' }, responses: { '200': { $ref: '#/components/responses/OtecResolutionResponse' }, '409': { $ref: '#/components/responses/Conflict' } } }
  /otec-compliance/readiness/evaluations:
    post: { operationId: evaluateOtecReadiness, summary: Evaluate internal OTEC readiness, description: Evaluates internal preparation evidence under configured rules and does not represent accreditation, authorization, or official SENCE approval., x-contract-status: implemented, x-permission: otec_compliance.readiness.evaluate, x-entitlement-feature: readiness, requestBody: { $ref: '#/components/requestBodies/EvaluateOtecReadinessBody' }, responses: { '200': { $ref: '#/components/responses/ReadinessEvaluationResponse' }, '400': { $ref: '#/components/responses/BadRequest' } } }
  /otec-compliance/compliance-summary:
    get: { operationId: getOtecComplianceSummary, summary: Get the internal compliance summary, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: readiness, parameters: [{ name: otecProfileId, in: query, required: true, schema: { type: string, format: uuid } }], responses: { '200': { $ref: '#/components/responses/ComplianceSummaryResponse' }, '404': { $ref: '#/components/responses/NotFound' } } }
  /otec-compliance/expiring-items:
    get: { operationId: listExpiringOtecComplianceItems, summary: List expiring tenant compliance evidence, x-contract-status: implemented, x-permission: otec_compliance.read, x-entitlement-feature: expirations, parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/PageSize' }], responses: { '200': { $ref: '#/components/responses/ExpiringItemsResponse' }, '400': { $ref: '#/components/responses/BadRequest' } } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    IfMatch: { name: If-Match, in: header, required: true, description: Weak ETag carrying the expected optimistic version. A stale value returns 409, never 412., schema: { type: string, pattern: '^W/"v[1-9][0-9]*"$' }, example: 'W/"v3"' }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  requestBodies:
    CreateOtecProfileBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOtecProfileRequest' } } } }
    UpdateOtecProfileBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOtecProfileRequest' } } } }
    OtecTransitionBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OtecTransitionRequest' } } } }
    CreateOtecAccreditationBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOtecAccreditationRequest' } } } }
    UpdateOtecAccreditationBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOtecAccreditationRequest' } } } }
    CreateQualityCertificationBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateQualityCertificationRequest' } } } }
    UpdateQualityCertificationBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateQualityCertificationRequest' } } } }
    CreateOtecOfficeBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOtecOfficeRequest' } } } }
    UpdateOtecOfficeBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOtecOfficeRequest' } } } }
    CreateLegalRepresentativeBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateLegalRepresentativeRequest' } } } }
    UpdateLegalRepresentativeBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateLegalRepresentativeRequest' } } } }
    CreateOtecResolutionBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CreateOtecResolutionRequest' } } } }
    UpdateOtecResolutionBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/UpdateOtecResolutionRequest' } } } }
    SupersedeOtecResolutionBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/SupersedeOtecResolutionRequest' } } } }
    EvaluateOtecReadinessBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/EvaluateOtecReadinessRequest' } } } }
  schemas:
    NullableText: { type: [string, 'null'], minLength: 1 }
    DateOnly: { type: string, format: date, example: '2026-07-17' }
    Uuid: { type: string, format: uuid, example: '10000000-0000-4000-8000-000000000001' }
    CreateOtecProfileRequest:
      { type: object, description: Creates the tenant singleton profile. Tenant and actor identity come only from authentication., additionalProperties: false, properties: { registrationCode: { $ref: '#/components/schemas/NullableText' }, rudoReference: { $ref: '#/components/schemas/NullableText' }, technicalContactName: { $ref: '#/components/schemas/NullableText' }, technicalContactEmail: { type: [string, 'null'], format: email }, technicalContactPhone: { $ref: '#/components/schemas/NullableText' }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { registrationCode: 'OTEC-DEMO-001' } }
    UpdateOtecProfileRequest:
      { type: object, description: Updates mutable singleton profile fields. Version is supplied only through If-Match., additionalProperties: false, properties: { registrationCode: { $ref: '#/components/schemas/NullableText' }, rudoReference: { $ref: '#/components/schemas/NullableText' }, technicalContactName: { $ref: '#/components/schemas/NullableText' }, technicalContactEmail: { type: [string, 'null'], format: email }, technicalContactPhone: { $ref: '#/components/schemas/NullableText' }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { notes: 'Updated internal evidence' } }
    OtecTransitionRequest:
      { type: object, description: Optional safe reason for an explicit lifecycle transition., additionalProperties: false, properties: { reason: { type: string, minLength: 1, maxLength: 500 } }, example: { reason: 'Internal review' } }
    CreateOtecAccreditationRequest:
      { type: object, description: Creates internal accreditation evidence., additionalProperties: false, required: [otecProfileId, accreditationType, accreditationNumber], properties: { otecProfileId: { $ref: '#/components/schemas/Uuid' }, accreditationType: { type: string, minLength: 1 }, accreditationNumber: { type: string, minLength: 1 }, issuedAt: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validFrom: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validUntil: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, issuingAuthority: { $ref: '#/components/schemas/NullableText' }, source: { $ref: '#/components/schemas/NullableText' }, externalReference: { $ref: '#/components/schemas/NullableText' }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { otecProfileId: '10000000-0000-4000-8000-000000000001', accreditationType: 'INTERNAL_REGISTRATION', accreditationNumber: 'ACC-DEMO-001' } }
    UpdateOtecAccreditationRequest:
      { type: object, description: Updates accreditation evidence; profile and version are immutable in the body., additionalProperties: false, properties: { accreditationType: { type: string, minLength: 1 }, accreditationNumber: { type: string, minLength: 1 }, issuedAt: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validFrom: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validUntil: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, issuingAuthority: { $ref: '#/components/schemas/NullableText' }, source: { $ref: '#/components/schemas/NullableText' }, externalReference: { $ref: '#/components/schemas/NullableText' }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { notes: 'Evidence reviewed' } }
    CreateQualityCertificationRequest:
      { type: object, description: Creates internal quality-certification evidence., additionalProperties: false, required: [otecProfileId, certificationType, certificationNumber, certifyingEntity], properties: { otecProfileId: { $ref: '#/components/schemas/Uuid' }, certificationType: { type: string, enum: [NCH_2728, ISO_9001, OTHER] }, certificationNumber: { type: string, minLength: 1 }, certifyingEntity: { type: string, minLength: 1 }, scope: { $ref: '#/components/schemas/NullableText' }, issuedAt: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validFrom: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validUntil: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, documentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { otecProfileId: '10000000-0000-4000-8000-000000000001', certificationType: NCH_2728, certificationNumber: 'CERT-DEMO-001', certifyingEntity: 'Fictitious Certification Entity' } }
    UpdateQualityCertificationRequest:
      { type: object, description: Updates quality-certification evidence., additionalProperties: false, properties: { certificationType: { type: string, enum: [NCH_2728, ISO_9001, OTHER] }, certificationNumber: { type: string, minLength: 1 }, certifyingEntity: { type: string, minLength: 1 }, scope: { $ref: '#/components/schemas/NullableText' }, issuedAt: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validFrom: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validUntil: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, documentId: { oneOf: [{ $ref: '#/components/schemas/Uuid' }, { type: 'null' }] }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { scope: 'Internal training services' } }
    CreateOtecOfficeRequest:
      { type: object, description: Creates an internal OTEC office record., additionalProperties: false, required: [otecProfileId, officeCode, name, officeType, street, city, commune, region, country], properties: { otecProfileId: { $ref: '#/components/schemas/Uuid' }, officeCode: { type: string, minLength: 1 }, name: { type: string, minLength: 1 }, officeType: { type: string, enum: [HEADQUARTERS, BRANCH, OPERATING_OFFICE, TRAINING_SITE, OTHER] }, street: { type: string, minLength: 1 }, city: { type: string, minLength: 1 }, commune: { type: string, minLength: 1 }, region: { type: string, minLength: 1 }, country: { type: string, minLength: 2, maxLength: 2 }, postalCode: { $ref: '#/components/schemas/NullableText' }, email: { type: [string, 'null'], format: email }, phone: { $ref: '#/components/schemas/NullableText' }, validFrom: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, validUntil: { oneOf: [{ $ref: '#/components/schemas/DateOnly' }, { type: 'null' }] }, notes: { $ref: '#/components/schemas/NullableText' } }, example: { otecProfileId: '10000000-0000-4000-8000-000000000001', officeCode: HQ-DEMO, name: 'Fictitious Headquarters', officeType: HEADQUARTERS, street: 'Test Street 1', city: Santiago, commune: Santiago, region: Metropolitana, country: CL } }
    UpdateOtecOfficeRequest:
