openapi: 3.1.0
info:
  title: SkillFlow AI API
  version: 0.1.0
  summary: API backend para Sistema de Gestión de Capacitaciones, OTEC, RRHH, cumplimiento y SENCE.
  description: |
    API REST para una plataforma SaaS multiempresa orientada a gestión de capacitaciones,
    planes anuales de capacitación, cursos, relatores, inscripciones, asistencia, evaluación,
    cumplimiento normativo, integración SENCE, reportería y módulos de inteligencia artificial.

    Stack objetivo:
    - Node.js
    - TypeScript strict mode
    - Express.js
    - Prisma ORM
    - PostgreSQL recomendado

    Convenciones:
    - Todas las fechas usan ISO 8601.
    - Todos los IDs son UUID.
    - La autenticación se realiza mediante JWT Bearer Token.
    - El modelo es multi-tenant mediante organizationId.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.SkillFlow AI.cl/api/v1
    description: Production

tags:
  - name: Auth
    description: Autenticación, sesión y recuperación de contraseña.
  - name: Organizations
    description: Empresas, OTEC, clientes y configuración multi-tenant.
  - name: Users
    description: Usuarios internos, administradores, RRHH, relatores y participantes.
  - name: Roles
    description: Roles y permisos del sistema.
  - name: Employees
    description: Dotación, cargos, áreas, competencias y ficha de trabajador.
  - name: Courses
    description: Catálogo de cursos, competencias, modalidad y contenidos.
  - name: TrainingPlans
    description: Plan anual de capacitación PAC y planificación presupuestaria.
  - name: TrainingSessions
    description: Ejecución de cursos, clases, agenda, salas y relatores.
  - name: Instructors
    description: Relatores internos y externos disponibles para ejecutar capacitaciones.
  - name: Enrollments
    description: Inscripciones, estados, cupos y trazabilidad.
  - name: Attendance
    description: Asistencia, firma digital, QR y evidencia.
  - name: Evaluations
    description: Evaluaciones, encuestas, resultados y aprobación.
  - name: Certificates
    description: Certificados, emisión, validación pública y trazabilidad.
  - name: SENCE
    description: Integración y control documental para procesos SENCE.
  - name: Providers
    description: OTEC externas, relatores, proveedores y contratos.
  - name: Documents
    description: Gestión documental, archivos y evidencias.
  - name: Reports
    description: Reportes ejecutivos, cumplimiento, costos y KPIs.
  - name: AI
    description: Copilot IA para recomendaciones, brechas y automatización.
  - name: Audit
    description: Auditoría, eventos y trazabilidad.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Health check de la API
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra una nueva organización y usuario administrador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Organización y usuario creados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtiene el usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /organizations:
    get:
      tags: [Organizations]
      summary: Lista organizaciones disponibles para el usuario
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
    post:
      tags: [Organizations]
      summary: Crea una organización cliente, OTEC o holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organización creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Obtiene una organización por ID
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organización encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    patch:
      tags: [Organizations]
      summary: Actualiza datos de una organización
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    delete:
      tags: [Organizations]
      summary: Desactiva una organización
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '204':
          description: Organización desactivada

  /users:
    get:
      tags: [Users]
      summary: Lista usuarios de la organización
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Usuarios paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [Users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Obtiene un usuario por ID
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Actualiza un usuario
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Desactiva un usuario
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Usuario desactivado

  /roles:
    get:
      tags: [Roles]
      summary: Lista roles del sistema
      responses:
        '200':
          description: Roles disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

  /employees:
    get:
      tags: [Employees]
      summary: Lista trabajadores o participantes internos
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: areaId
          in: query
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trabajadores paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
    post:
      tags: [Employees]
      summary: Crea ficha de trabajador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Trabajador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{employeeId}:
    get:
      tags: [Employees]
      summary: Obtiene ficha de trabajador
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Trabajador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    patch:
      tags: [Employees]
      summary: Actualiza ficha de trabajador
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /courses:
    get:
      tags: [Courses]
      summary: Lista catálogo de cursos
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/CourseModality'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CourseStatus'
      responses:
        '200':
          description: Cursos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags: [Courses]
      summary: Crea un curso en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

  /courses/{courseId}:
    get:
      tags: [Courses]
      summary: Obtiene curso por ID
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    patch:
      tags: [Courses]
      summary: Actualiza curso
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    delete:
      tags: [Courses]
      summary: Desactiva curso
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '204':
          description: Curso desactivado

  /training-plans:
    get:
      tags: [TrainingPlans]
      summary: Lista planes anuales de capacitación
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrainingPlanStatus'
      responses:
        '200':
          description: Planes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanListResponse'
    post:
      tags: [TrainingPlans]
      summary: Crea plan anual de capacitación PAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingPlanRequest'
      responses:
        '201':
          description: Plan creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'

  /training-plans/{trainingPlanId}:
    get:
      tags: [TrainingPlans]
      summary: Obtiene un plan anual
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      responses:
        '200':
          description: Plan encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'
    patch:
      tags: [TrainingPlans]
      summary: Actualiza plan anual
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingPlanRequest'
      responses:
        '200':
          description: Plan actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'

  /training-plans/{trainingPlanId}/items:
    post:
      tags: [TrainingPlans]
      summary: Agrega curso planificado al PAC
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingPlanItemRequest'
      responses:
        '201':
          description: Ítem agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItem'

  /training-sessions:
    get:
      tags: [TrainingSessions]
      summary: Lista ejecuciones o instancias de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.read
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: courseId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrainingSessionStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Sesiones paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionListResponse'
    post:
      tags: [TrainingSessions]
      summary: Programa una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingSessionRequest'
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /training-sessions/{trainingSessionId}:
    get:
      tags: [TrainingSessions]
      summary: Obtiene una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.read
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Sesión encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
    patch:
      tags: [TrainingSessions]
      summary: Actualiza una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.update
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingSessionRequest'
      responses:
        '200':
          description: Sesión actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /training-sessions/{trainingSessionId}/publish:
    post:
      tags: [TrainingSessions]
      summary: Publica una capacitación y habilita inscripciones
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.publish
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Sesión publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /instructors:
    get:
      tags: [Instructors]
      summary: Lista relatores de una organización
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.read
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InstructorStatus'
        - name: providerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Relatores paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorListResponse'
    post:
      tags: [Instructors]
      summary: Crea un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructorRequest'
      responses:
        '201':
          description: Relator creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'

  /instructors/{instructorId}:
    get:
      tags: [Instructors]
      summary: Obtiene un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.read
      parameters:
        - $ref: '#/components/parameters/InstructorId'
      responses:
        '200':
          description: Relator encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
    patch:
      tags: [Instructors]
      summary: Actualiza un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.update
      parameters:
        - $ref: '#/components/parameters/InstructorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstructorRequest'
      responses:
        '200':
          description: Relator actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'

  /enrollments:
    get:
      tags: [Enrollments]
      summary: Lista inscripciones
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: trainingSessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
      responses:
        '200':
          description: Inscripciones paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
    post:
      tags: [Enrollments]
      summary: Inscribe trabajador a una capacitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Inscripción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}:
    patch:
      tags: [Enrollments]
      summary: Actualiza estado de inscripción
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnrollmentRequest'
      responses:
        '200':
          description: Inscripción actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /attendance/check-in:
    post:
      tags: [Attendance]
      summary: Registra asistencia de entrada mediante QR, firma o registro manual
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckInRequest'
      responses:
        '201':
          description: Asistencia registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'

  /attendance/check-out:
    post:
      tags: [Attendance]
      summary: Registra salida de participante
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttendanceCheckOutRequest'
      responses:
        '200':
          description: Salida registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttendanceRecord'

  /attendance/sessions/{trainingSessionId}:
    get:
      tags: [Attendance]
      summary: Obtiene asistencia de una capacitación
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Asistencia por sesión
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttendanceRecord'

  /evaluations:
    post:
      tags: [Evaluations]
      summary: Crea evaluación asociada a una capacitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationRequest'
      responses:
        '201':
          description: Evaluación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evaluation'

  /evaluations/{evaluationId}/responses:
    post:
      tags: [Evaluations]
      summary: Registra respuesta de evaluación de un participante
      parameters:
        - $ref: '#/components/parameters/EvaluationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEvaluationResponseRequest'
      responses:
        '201':
          description: Respuesta registrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResponse'

  /certificates:
    get:
      tags: [Certificates]
      summary: Lista certificados emitidos
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: courseId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Certificados encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateListResponse'

  /certificates/issue:
    post:
      tags: [Certificates]
      summary: Emite certificado para inscripción aprobada
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [enrollmentId]
              properties:
                enrollmentId:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Certificado emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Certificate'

  /certificates/verify/{verificationCode}:
    get:
      tags: [Certificates]
      summary: Verifica públicamente la validez de un certificado
      security: []
      parameters:
        - name: verificationCode
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Certificado válido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CertificateVerification'

  /sence/declarations:
    get:
      tags: [SENCE]
      summary: Lista declaraciones SENCE
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/SenceDeclarationStatus'
      responses:
        '200':
          description: Declaraciones encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenceDeclarationListResponse'
    post:
      tags: [SENCE]
      summary: Crea declaración SENCE para una capacitación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSenceDeclarationRequest'
      responses:
        '201':
          description: Declaración creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenceDeclaration'

  /sence/declarations/{senceDeclarationId}/submit:
    post:
      tags: [SENCE]
      summary: Marca declaración SENCE como enviada o preparada para integración externa
      parameters:
        - $ref: '#/components/parameters/SenceDeclarationId'
      responses:
        '200':
          description: Declaración enviada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SenceDeclaration'

  /providers:
    get:
      tags: [Providers]
      summary: Lista proveedores, OTEC externas o relatores
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: type
          in: query
          schema:
            $ref: '#/components/schemas/ProviderType'
      responses:
        '200':
          description: Proveedores encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderListResponse'
    post:
      tags: [Providers]
      summary: Crea proveedor o relator externo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProviderRequest'
      responses:
        '201':
          description: Proveedor creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Provider'

  /documents:
    post:
      tags: [Documents]
      summary: Registra metadata de documento o evidencia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDocumentRequest'
      responses:
        '201':
          description: Documento registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Document'

  /reports/dashboard:
    get:
      tags: [Reports]
      summary: Dashboard ejecutivo de capacitación
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
      responses:
        '200':
          description: KPIs ejecutivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReport'

  /reports/training-compliance:
    get:
      tags: [Reports]
      summary: Reporte de cumplimiento de capacitación
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cumplimiento por área, cargo y curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingComplianceReport'

  /ai/recommendations/training-gaps:
    post:
      tags: [AI]
      summary: Recomienda brechas de capacitación según cargo, competencias e historial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingGapRecommendationRequest'
      responses:
        '200':
          description: Recomendaciones generadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGapRecommendationResponse'

  /audit/events:
    get:
      tags: [Audit]
      summary: Lista eventos de auditoría
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eventos de auditoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationIdQuery:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingPlanId:
      name: trainingPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingSessionId:
      name: trainingSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstructorId:
      name: instructorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SenceDeclarationId:
      name: senceDeclarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos para ejecutar la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con recurso existente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Request validation failed
            details:
              type: array
              items:
                type: object

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    RegisterRequest:
      type: object
      required: [organizationName, taxId, firstName, lastName, email, password]
      properties:
        organizationName:
          type: string
          example: ACME Capacitación SpA
        taxId:
          type: string
          example: 76.123.456-7
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

    TokenResponse:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string

    OrganizationType:
      type: string
      enum: [CLIENT_COMPANY, OTEC, HOLDING, INTERNAL]
    OrganizationStatus:
      type: string
      enum: [ACTIVE, INACTIVE, SUSPENDED]

    Organization:
      type: object
      required: [id, name, taxId, type, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        taxId:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        status:
          $ref: '#/components/schemas/OrganizationStatus'
        legalName:
          type: string
        industry:
          type: string
        country:
          type: string
          example: CL
        settings:
          type: object
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name, taxId, type]
      properties:
        name:
          type: string
        taxId:
          type: string
        type:
          $ref: '#/components/schemas/OrganizationType'
        legalName:
          type: string
