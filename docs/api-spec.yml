        organizationId:
          type: string
          format: uuid
        employeeId:
          type: string
          format: uuid
        areaId:
          type: string
          format: uuid
        positionId:
          type: string
          format: uuid
        objective:
          type: string
          example: Reducir brechas obligatorias de seguridad operacional.

    TrainingGapRecommendationResponse:
      type: object
      required: [recommendations]
      properties:
        recommendations:
          type: array
          items:
            type: object
            properties:
              employeeId:
                type: string
                format: uuid
              courseId:
                type: string
                format: uuid
              priority:
                type: string
                enum: [LOW, MEDIUM, HIGH, CRITICAL]
              reason:
                type: string
              expectedImpact:
                type: string

    AuditEvent:
      type: object
      required: [id, organizationId, actorUserId, action, entityType, entityId, createdAt]
      properties:
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        actorUserId:
          type: string
          format: uuid
        action:
          type: string
          example: COURSE_CREATED
        entityType:
          type: string
          example: Course
        entityId:
          type: string
          format: uuid
        before:
          type: object
        after:
          type: object
        ipAddress:
          type: string
        userAgent:
          type: string
        createdAt:
          type: string
          format: date-time

    AuditEventListResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/AuditEvent'
        meta:
          $ref: '#/components/schemas/PaginationMeta'
