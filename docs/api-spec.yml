openapi: 3.1.0
info:
  title: SkillFlow AI API
  version: 0.1.0
  summary: API backend para Sistema de Gestión de Capacitaciones, OTEC, RRHH, cumplimiento y SENCE.
  description: |
    API REST para una plataforma SaaS multiempresa orientada a gestión de capacitaciones,
    planes anuales de capacitación, cursos, relatores, inscripciones, asistencia, evaluación,
    cumplimiento normativo, integración SENCE, reportería y módulos de inteligencia artificial.

    Stack objetivo:
    - Node.js
    - TypeScript strict mode
    - Express.js
    - Prisma ORM
    - PostgreSQL recomendado

    Convenciones:
    - Todas las fechas usan ISO 8601.
    - Todos los IDs son UUID.
    - La autenticación se realiza mediante JWT Bearer Token.
    - El modelo es multi-tenant mediante organizationId.
servers:
  - url: http://localhost:3000/api/v1
    description: Local development
  - url: https://api.SkillFlow AI.cl/api/v1
    description: Production

tags:
  - name: Auth
    description: Autenticación, sesión y recuperación de contraseña.
  - name: Organizations
    description: Empresas, OTEC, clientes y configuración multi-tenant.
  - name: Users
    description: Usuarios internos, administradores, RRHH, relatores y participantes.
  - name: Roles
    description: Roles y permisos del sistema.
  - name: Employees
    description: Dotación, cargos, áreas, competencias y ficha de trabajador.
  - name: Courses
    description: Catálogo de cursos, competencias, modalidad y contenidos.
  - name: TrainingPlans
    description: Plan anual de capacitación PAC y planificación presupuestaria.
  - name: TrainingSessions
    description: Ejecución de cursos, clases, agenda, salas y relatores.
  - name: Instructors
    description: Relatores internos y externos disponibles para ejecutar capacitaciones.
  - name: Enrollments
    description: Inscripciones, estados, cupos y trazabilidad.
  - name: Attendance
    description: Asistencia, firma digital, QR y evidencia.
  - name: Evaluations
    description: Evaluaciones, encuestas, resultados y aprobación.
  - name: Certificates
    description: Certificados, emisión, validación pública y trazabilidad.
  - name: SENCE
    description: Integración y control documental para procesos SENCE.
  - name: Providers
    description: OTEC externas, relatores, proveedores y contratos.
  - name: Documents
    description: Gestión documental, archivos y evidencias.
  - name: Reports
    description: Reportes ejecutivos, cumplimiento, costos y KPIs.
  - name: AI
    description: Copilot IA para recomendaciones, brechas y automatización.
  - name: Audit
    description: Auditoría, eventos y trazabilidad.

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [System]
      summary: Health check de la API
      security: []
      responses:
        '200':
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/register:
    post:
      tags: [Auth]
      summary: Registra una nueva organización y usuario administrador
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Organización y usuario creados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'

  /auth/login:
    post:
      tags: [Auth]
      summary: Inicia sesión con email y contraseña
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtiene el usuario autenticado
      responses:
        '200':
          description: Usuario autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renueva el token de acceso
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: Token renovado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'

  /organizations:
    get:
      tags: [Organizations]
      summary: Lista organizaciones disponibles para el usuario
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Listado paginado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
    post:
      tags: [Organizations]
      summary: Crea una organización cliente, OTEC o holding
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organización creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'

  /organizations/{organizationId}:
    get:
      tags: [Organizations]
      summary: Obtiene una organización por ID
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Organización encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    patch:
      tags: [Organizations]
      summary: Actualiza datos de una organización
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationRequest'
      responses:
        '200':
          description: Organización actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
    delete:
      tags: [Organizations]
      summary: Desactiva una organización
      parameters:
        - $ref: '#/components/parameters/OrganizationId'
      responses:
        '204':
          description: Organización desactivada

  /users:
    get:
      tags: [Users]
      summary: Lista usuarios de la organización
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Usuarios paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
    post:
      tags: [Users]
      summary: Crea un usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /users/{userId}:
    get:
      tags: [Users]
      summary: Obtiene un usuario por ID
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: Usuario encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    patch:
      tags: [Users]
      summary: Actualiza un usuario
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
    delete:
      tags: [Users]
      summary: Desactiva un usuario
      parameters:
        - $ref: '#/components/parameters/UserId'
      responses:
        '204':
          description: Usuario desactivado

  /roles:
    get:
      tags: [Roles]
      summary: Lista roles del sistema
      responses:
        '200':
          description: Roles disponibles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'

  /employees:
    get:
      tags: [Employees]
      summary: Lista trabajadores o participantes internos
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: areaId
          in: query
          schema:
            type: string
            format: uuid
        - name: positionId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Trabajadores paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeeListResponse'
    post:
      tags: [Employees]
      summary: Crea ficha de trabajador
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEmployeeRequest'
      responses:
        '201':
          description: Trabajador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /employees/{employeeId}:
    get:
      tags: [Employees]
      summary: Obtiene ficha de trabajador
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      responses:
        '200':
          description: Trabajador encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
    patch:
      tags: [Employees]
      summary: Actualiza ficha de trabajador
      parameters:
        - $ref: '#/components/parameters/EmployeeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEmployeeRequest'
      responses:
        '200':
          description: Trabajador actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'

  /courses:
    get:
      tags: [Courses]
      summary: Lista catálogo de cursos
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: modality
          in: query
          schema:
            $ref: '#/components/schemas/CourseModality'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/CourseStatus'
      responses:
        '200':
          description: Cursos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseListResponse'
    post:
      tags: [Courses]
      summary: Crea un curso en el catálogo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: Curso creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'

  /courses/{courseId}:
    get:
      tags: [Courses]
      summary: Obtiene curso por ID
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '200':
          description: Curso encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    patch:
      tags: [Courses]
      summary: Actualiza curso
      parameters:
        - $ref: '#/components/parameters/CourseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '200':
          description: Curso actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Course'
    delete:
      tags: [Courses]
      summary: Desactiva curso
      parameters:
        - $ref: '#/components/parameters/CourseId'
      responses:
        '204':
          description: Curso desactivado

  /training-plans:
    get:
      tags: [TrainingPlans]
      summary: Lista planes anuales de capacitación
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: year
          in: query
          schema:
            type: integer
            example: 2026
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrainingPlanStatus'
      responses:
        '200':
          description: Planes encontrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanListResponse'
    post:
      tags: [TrainingPlans]
      summary: Crea plan anual de capacitación PAC
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingPlanRequest'
      responses:
        '201':
          description: Plan creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'

  /training-plans/{trainingPlanId}:
    get:
      tags: [TrainingPlans]
      summary: Obtiene un plan anual
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      responses:
        '200':
          description: Plan encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'
    patch:
      tags: [TrainingPlans]
      summary: Actualiza plan anual
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingPlanRequest'
      responses:
        '200':
          description: Plan actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlan'

  /training-plans/{trainingPlanId}/items:
    post:
      tags: [TrainingPlans]
      summary: Agrega curso planificado al PAC
      parameters:
        - $ref: '#/components/parameters/TrainingPlanId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingPlanItemRequest'
      responses:
        '201':
          description: Ítem agregado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingPlanItem'

  /training-sessions:
    get:
      tags: [TrainingSessions]
      summary: Lista ejecuciones o instancias de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.read
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: courseId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TrainingSessionStatus'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Sesiones paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSessionListResponse'
    post:
      tags: [TrainingSessions]
      summary: Programa una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTrainingSessionRequest'
      responses:
        '201':
          description: Sesión creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /training-sessions/{trainingSessionId}:
    get:
      tags: [TrainingSessions]
      summary: Obtiene una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.read
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Sesión encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'
    patch:
      tags: [TrainingSessions]
      summary: Actualiza una instancia de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.update
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTrainingSessionRequest'
      responses:
        '200':
          description: Sesión actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /training-sessions/{trainingSessionId}/publish:
    post:
      tags: [TrainingSessions]
      summary: Publica una capacitación y habilita inscripciones
      security:
        - bearerAuth: []
      x-permissions:
        - training_sessions.publish
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Sesión publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingSession'

  /instructors:
    get:
      tags: [Instructors]
      summary: Lista relatores de una organización
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.read
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InstructorStatus'
        - name: providerId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Relatores paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstructorListResponse'
    post:
      tags: [Instructors]
      summary: Crea un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInstructorRequest'
      responses:
        '201':
          description: Relator creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'

  /instructors/{instructorId}:
    get:
      tags: [Instructors]
      summary: Obtiene un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.read
      parameters:
        - $ref: '#/components/parameters/InstructorId'
      responses:
        '200':
          description: Relator encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'
    patch:
      tags: [Instructors]
      summary: Actualiza un relator
      security:
        - bearerAuth: []
      x-permissions:
        - instructors.update
      parameters:
        - $ref: '#/components/parameters/InstructorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInstructorRequest'
      responses:
        '200':
          description: Relator actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Instructor'

  /enrollments:
    get:
      tags: [Enrollments]
      summary: Lista inscripciones
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.read
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: trainingSessionId
          in: query
          schema:
            type: string
            format: uuid
        - name: employeeId
          in: query
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/EnrollmentStatus'
      responses:
        '200':
          description: Inscripciones paginadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
    post:
      tags: [Enrollments]
      summary: Inscribe trabajador a una capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        '201':
          description: Inscripción creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}:
    get:
      tags: [Enrollments]
      summary: Obtiene una inscripción
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.read
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Inscripción encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'
    put:
      tags: [Enrollments]
      summary: Actualiza estado de inscripción
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.update
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEnrollmentRequest'
      responses:
        '200':
          description: Inscripción actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}/confirm:
    post:
      tags: [Enrollments]
      summary: Confirma una inscripción
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.confirm
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Inscripción confirmada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}/reject:
    post:
      tags: [Enrollments]
      summary: Rechaza una inscripción
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.reject
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Inscripción rechazada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}/cancel:
    post:
      tags: [Enrollments]
      summary: Cancela una inscripción y promueve lista de espera si corresponde
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.cancel
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Inscripción cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /enrollments/{enrollmentId}/complete:
    post:
      tags: [Enrollments]
      summary: Marca una inscripción como completada
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.complete
      parameters:
        - $ref: '#/components/parameters/EnrollmentId'
      responses:
        '200':
          description: Inscripción completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrollment'

  /training-sessions/{trainingSessionId}/enrollments:
    get:
      tags: [Enrollments]
      summary: Lista inscripciones de una sesión de capacitación
      security:
        - bearerAuth: []
      x-permissions:
        - enrollments.read
      parameters:
        - $ref: '#/components/parameters/TrainingSessionId'
      responses:
        '200':
          description: Inscripciones de la sesión
          content:
            application/json:
              schema:
