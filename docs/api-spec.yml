          schema:
            type: integer
            example: 2026
      responses:
        '200':
          description: KPIs ejecutivos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardReport'

  /reports/training-compliance:
    get:
      tags: [Reports]
      summary: Reporte de cumplimiento de capacitación
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Cumplimiento por área, cargo y curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingComplianceReport'

  /ai/recommendations/training-gaps:
    post:
      tags: [AI]
      summary: Recomienda brechas de capacitación según cargo, competencias e historial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TrainingGapRecommendationRequest'
      responses:
        '200':
          description: Recomendaciones generadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingGapRecommendationResponse'

  /audit/events:
    get:
      tags: [Audit]
      summary: Lista eventos de auditoría
      parameters:
        - $ref: '#/components/parameters/OrganizationIdQuery'
        - name: entityType
          in: query
          schema:
            type: string
        - name: entityId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Eventos de auditoría
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventListResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
        maxLength: 120
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrganizationIdQuery:
      name: organizationId
      in: query
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EmployeeId:
      name: employeeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CourseId:
      name: courseId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingPlanId:
      name: trainingPlanId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrainingSessionId:
      name: trainingSessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InstructorId:
      name: instructorId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AttendanceId:
      name: attendanceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EvaluationId:
      name: evaluationId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuestionId:
      name: questionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SenceDeclarationId:
      name: declarationId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Solicitud inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: No autenticado o token inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Sin permisos para ejecutar la acción
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso no encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicto con recurso existente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required: [status, timestamp]
      properties:
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: VALIDATION_ERROR
            message:
              type: string
              example: Request validation failed
            details:
              type: array
              items:
                type: object

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    RegisterRequest:
      type: object
      required: [organizationName, taxId, firstName, lastName, email, password]
      properties:
        organizationName:
          type: string
          example: ACME Capacitación SpA
        taxId:
          type: string
          example: 76.123.456-7
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    AuthResponse:
      type: object
      required: [accessToken, refreshToken, user]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/User'

