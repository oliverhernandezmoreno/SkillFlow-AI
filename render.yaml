services:
  - type: web
    name: skillflow-ai-backend
    runtime: node
    plan: free
    buildCommand: npm ci && npm run prisma:generate && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        value: http://localhost:3001,https://skillflow-ai.vercel.app
      - key: JSON_PAYLOAD_LIMIT
        value: 1mb
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 300
      - key: ENABLE_DEMO_BOOTSTRAP
        value: false
      - key: BOOTSTRAP_SECRET
        sync: false
